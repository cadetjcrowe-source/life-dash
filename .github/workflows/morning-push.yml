# Optional: makes the morning notification arrive at the exact time you pick in
# Settings. Vercel's free plan only allows a once-a-day cron, so this pings the
# app every 15 minutes; the app sends the notification once, at your chosen time.
# Needs two repository secrets: LIFE_URL (e.g. https://life-dash-xyz.vercel.app)
# and CRON_SECRET (the same value as in Vercel). Without them it does nothing.
name: Morning summary pinger

on:
  schedule:
    - cron: "*/15 5-10 * * *" # every 15 min, 05:00–10:45 UTC (06:00–11:45 in summer time)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the morning summary endpoint
        env:
          LIFE_URL: ${{ secrets.LIFE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$LIFE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "LIFE_URL / CRON_SECRET secrets not set – skipping."; exit 0
          fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "${LIFE_URL%/}/api/cron/morning?mode=precise"
